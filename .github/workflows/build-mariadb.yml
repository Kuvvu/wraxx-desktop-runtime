name: build-mariadb

on:
  workflow_dispatch:
    inputs:
      version:
        description: MariaDB source tag
        default: mariadb-11.8.9
      release:
        description: Create a GitHub release with the artifacts
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install build tools (macOS)
        run: |
          brew install cmake ninja bison pkgconf
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Fetch MariaDB source
        run: |
          git clone --depth 1 --branch "${{ inputs.version }}" \
            --recurse-submodules --shallow-submodules \
            https://github.com/MariaDB/server.git src

      - name: Configure
        run: |
          cmake -S src -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_SSL=bundled \
            -DWITH_UNIT_TESTS=OFF \
            -DWITH_EMBEDDED_SERVER=OFF \
            -DWITH_WSREP=OFF \
            -DPLUGIN_ROCKSDB=NO -DPLUGIN_MROONGA=NO -DPLUGIN_SPIDER=NO \
            -DPLUGIN_CONNECT=NO -DPLUGIN_OQGRAPH=NO -DPLUGIN_S3=NO \
            -DPLUGIN_COLUMNSTORE=NO -DPLUGIN_TOKUDB=NO

      - name: Build
        run: cmake --build build --parallel

      - name: Install to staging dir
        run: |
          DESTDIR="$PWD/stage" cmake --install build --prefix /mariadb
          rm -rf stage/mariadb/mysql-test stage/mariadb/sql-bench stage/mariadb/include

      - name: Strip and ad-hoc sign (macOS)
        run: |
          find stage -type f \( -perm -u+x -o -name '*.dylib' \) | while read -r f; do
            if file "$f" | grep -q 'Mach-O'; then
              strip -x "$f" || true
              codesign -s - -f "$f"
            fi
          done

      - name: Smoke test
        run: stage/mariadb/bin/mariadbd --version

      - name: Package
        run: |
          name="${{ inputs.version }}-${{ matrix.platform }}"
          tar -czf "$name.tar.gz" -C stage mariadb
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            *.tar.gz
            *.sha256

  release:
    if: ${{ inputs.release }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.version }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ inputs.version }}" \
            --notes "MariaDB ${{ inputs.version }} built from source for Wraxx Desktop."
