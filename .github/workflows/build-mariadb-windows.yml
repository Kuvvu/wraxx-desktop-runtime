name: build-mariadb-windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: MariaDB source tag
        default: mariadb-11.8.9
      release:
        description: Upload the zip to the existing release of the same tag
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build tools
        shell: bash
        run: choco install -y --no-progress ninja winflexbison3

      - name: Fetch MariaDB source
        shell: bash
        run: |
          git clone --depth 1 --branch "${{ inputs.version }}" \
            --recurse-submodules --shallow-submodules \
            https://github.com/MariaDB/server.git src

      - name: Configure
        shell: bash
        run: |
          BISON="$(command -v win_bison.exe || command -v bison.exe)"
          cmake -S src -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBISON_EXECUTABLE="$BISON" \
            -DWITH_SSL=bundled \
            -DWITH_UNIT_TESTS=OFF \
            -DWITH_EMBEDDED_SERVER=OFF \
            -DWITH_WSREP=OFF \
            -DPLUGIN_ROCKSDB=NO -DPLUGIN_MROONGA=NO -DPLUGIN_SPIDER=NO \
            -DPLUGIN_CONNECT=NO -DPLUGIN_OQGRAPH=NO -DPLUGIN_S3=NO \
            -DPLUGIN_COLUMNSTORE=NO -DPLUGIN_TOKUDB=NO \
            -DPLUGIN_PROVIDER_LZO=NO -DPLUGIN_PROVIDER_LZ4=NO -DPLUGIN_PROVIDER_LZMA=NO \
            -DPLUGIN_PROVIDER_BZIP2=NO -DPLUGIN_PROVIDER_SNAPPY=NO

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Install to staging dir
        shell: bash
        run: |
          cmake --install build --prefix "$PWD/stage/mariadb"
          rm -rf stage/mariadb/mysql-test stage/mariadb/sql-bench stage/mariadb/include
          rm -rf stage/mariadb/mariadb-test stage/mariadb/symbols
          find stage/mariadb -name '*.pdb' -delete
          find stage/mariadb -name "*.lib" -delete
          rm -f stage/mariadb/bin/mariadb-test.exe stage/mariadb/bin/mysqltest.exe

      - name: Smoke test
        shell: bash
        run: |
          stage/mariadb/bin/mariadbd.exe --version
          stage/mariadb/bin/mariadb.exe --version
          test -f stage/mariadb/bin/mariadb-install-db.exe
          test -f stage/mariadb/bin/server.dll
          test -f stage/mariadb/lib/libmariadb.dll
          test -d stage/mariadb/lib/plugin

      - name: Package
        shell: bash
        run: |
          name="${{ inputs.version }}-windows-amd64"
          (cd stage && 7z a -tzip "../$name.zip" mariadb)
          sha256sum "$name.zip" > "$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: |
            *.zip
            *.sha256

      - name: Upload to release
        if: ${{ inputs.release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.version }}" *.zip *.sha256 --clobber --repo "${{ github.repository }}"
